[workspace]
members = [
    "crates/knave-renderer",
    "crates/knave-shell",
    "crates/knave-ui",
    "crates/knave-wayland",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
knave-renderer = { path = "crates/knave-renderer" }
knave-wayland = { path = "crates/knave-wayland" }
knave-ui = { path = "crates/knave-ui" }
wgpu = "30.0.1"
knave-desktop-api = { git = "ssh://git@github.com/knave-de/knave.git", rev = "1a7a031" }
pollster = "1.0.1"
thiserror = "2.0.21"
smithay-client-toolkit = { version = "0.21.1", default-features = false }
wayland-client = { version = "0.31.15", features = ["system"] }
